{% extends "core/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Ajouter un élève</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Enregistrer
        </button>

        <a href="{% url 'liste_eleves' %}" class="btn btn-secondary">
            Annuler
        </a>

    </form>

</div>

{% endblock %}
