{% extends "core/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>➕ Nouveau cours</h3>
        </div>

        <div class="card-body">

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Publier
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
