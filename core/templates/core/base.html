<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kaay Nu Djang</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'accueil' %}">
            📚 Kaay Nu Djang
        </a>

        <div class="collapse navbar-collapse">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'accueil' %}">
                        Accueil
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#classes">
                        Classes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Actualités
                    </a>
                </li>

            </ul>

            <form class="d-flex me-3" method="get" action="{% url 'recherche' %}">
                <input
                    class="form-control"
                    type="search"
                    name="q"
                    placeholder="Rechercher un cours..."
                    value="{{ request.GET.q }}">
            </form>

            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    Bonjour {{ user.username }}
                </span>

                <a href="{% url 'deconnexion' %}" class="btn btn-light">
                    Déconnexion
                </a>

            {% else %}

                <a href="{% url 'connexion' %}" class="btn btn-light">
                    Connexion
                </a>

            {% endif %}

        </div>

    </div>
</nav>
